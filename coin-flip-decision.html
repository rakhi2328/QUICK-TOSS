<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toss — let the coin decide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#080c16;
    --ink-800:#0d1424;
    --ink-700:#151f38;
    --ink-600:#212d4d;
    --brass-100:#f6e6ac;
    --brass-300:#e0bd70;
    --brass-500:#c79a45;
    --brass-700:#8a6423;
    --brass-900:#4a3812;
    --parchment:#efe7d4;
    --muted:#8993ac;
    --glow: rgba(224,189,112,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #16223f 0%, transparent 60%),
      radial-gradient(circle at 50% 50%, var(--ink-800) 0%, var(--ink-900) 70%);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    overflow-x:hidden;
  }

  /* faint felt/vault texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events:none;
    mix-blend-mode:overlay;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px, 3vw, 30px);
    padding:6vh 20px 8vh;
    text-align:center;
    position:relative;
  }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--brass-300);
    opacity:0.85;
  }

  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:clamp(24px, 4vw, 40px);
    line-height:1.25;
    margin:0;
    max-width:14ch;
    color:var(--parchment);
    text-shadow:0 2px 18px rgba(0,0,0,0.5);
  }

  h1 em{
    font-style:normal;
    color:var(--brass-300);
  }

  /* ---------- coin ---------- */

  .coin-scene{
    perspective:1400px;
    width:clamp(180px, 40vw, 260px);
    height:clamp(180px, 40vw, 260px);
    margin:10px 0 0;
  }

  .coin{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    cursor:pointer;
    outline:none;
    -webkit-tap-highlight-color:transparent;
  }

  .coin:focus-visible .coin-face{
    box-shadow:
      inset 0 0 0 4px rgba(0,0,0,0.35),
      0 0 0 4px var(--glow),
      0 14px 40px rgba(0,0,0,0.55);
  }

  .coin-face{
    position:absolute;
    inset:0;
    border-radius:50%;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 32% 28%, var(--brass-100) 0%, var(--brass-300) 32%, var(--brass-500) 62%, var(--brass-700) 100%);
    box-shadow:
      inset 0 0 0 6px rgba(255,247,222,0.18),
      inset 0 0 22px rgba(0,0,0,0.35),
      0 14px 40px rgba(0,0,0,0.55);
  }

  .coin-face.tails{ transform:rotateY(180deg); }

  /* reeded rim, drawn as a conic stripe ring */
  .coin-face::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    padding:6px;
    background:
      repeating-conic-gradient(from 0deg,
        rgba(74,56,18,0.55) 0deg 1.6deg,
        rgba(246,230,172,0.35) 1.6deg 3.2deg);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity:0.9;
  }

  .coin-glyph{
    position:relative;
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(56px, 13vw, 92px);
    color:var(--brass-900);
    text-shadow:
      0 1px 0 rgba(255,247,222,0.55),
      0 -1px 1px rgba(0,0,0,0.45);
    letter-spacing:0.02em;
    user-select:none;
  }

  .coin-face .ring-label{
    position:absolute;
    inset:16px;
    border-radius:50%;
    border:1.5px solid rgba(74,56,18,0.4);
    pointer-events:none;
  }

  /* landing glint sweep */
  .coin.landed .coin-face::after{
    content:"";
    position:absolute;
    inset:-10%;
    border-radius:50%;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.55) 50%, transparent 60%);
    transform:translateX(-120%);
    animation:glint 0.9s ease-out forwards;
  }

  @keyframes glint{
    to{ transform:translateX(120%); }
  }

  .coin-shadow{
    width:clamp(120px, 26vw, 170px);
    height:18px;
    margin-top:-6px;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, transparent 72%);
    transition:transform 2s cubic-bezier(.22,.68,.35,1), opacity 2s;
    transform-origin:center;
  }

  .coin-shadow.tossing{
    transform:scale(0.55, 0.55);
    opacity:0.4;
  }

  /* ---------- status / result ---------- */

  .status{
    min-height:64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }

  .prompt{
    font-family:'Space Mono', monospace;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    transition:opacity 0.25s ease;
  }

  .result{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:clamp(26px, 5vw, 38px);
    color:var(--brass-100);
    opacity:0;
    transform:translateY(6px) scale(0.96);
    transition:opacity 0.4s ease, transform 0.4s ease;
    text-shadow:0 0 26px var(--glow);
  }

  .result.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  /* ---------- ledger ---------- */

  .ledger{
    position:fixed;
    right:22px;
    bottom:20px;
    max-width:min(60vw, 320px);
    text-align:right;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.08em;
    line-height:1.8;
  }

  .ledger .ledger-label{
    display:block;
    text-transform:uppercase;
    letter-spacing:0.24em;
    color:var(--brass-500);
    margin-bottom:4px;
    font-size:10px;
  }

  .ledger .marks{
    word-break:break-all;
  }

  .mark-h{ color:var(--brass-300); }
  .mark-t{ color:var(--muted); }

  @media (max-width:520px){
    .ledger{
      position:static;
      margin-top:10px;
      text-align:center;
      max-width:none;
    }
  }

  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion: reduce){
    .coin, .coin-shadow, .result{ transition-duration:0.2s !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <span class="eyebrow">Make the call</span>
  <h1>Heads or tails.<br>Let the <em>coin</em> decide.</h1>

  <div class="coin-scene">
    <div class="coin" id="coin" role="button" tabindex="0" aria-label="Flip the coin">
      <div class="coin-face heads">
        <span class="ring-label"></span>
        <span class="coin-glyph">H</span>
      </div>
      <div class="coin-face tails">
        <span class="ring-label"></span>
        <span class="coin-glyph">T</span>
      </div>
    </div>
  </div>
  <div class="coin-shadow" id="coinShadow"></div>

  <div class="status">
    <span class="prompt" id="prompt">Tap the coin to flip</span>
    <span class="result" id="result">Heads</span>
  </div>

  <div aria-live="polite" class="sr-only" id="announcer"></div>
</div>

<div class="ledger">
  <span class="ledger-label">Ledger</span>
  <span class="marks" id="marks">—</span>
</div>

<script>
(function(){
  const coin       = document.getElementById('coin');
  const shadow     = document.getElementById('coinShadow');
  const prompt     = document.getElementById('prompt');
  const result     = document.getElementById('result');
  const marksEl    = document.getElementById('marks');
  const announcer  = document.getElementById('announcer');

  let flipping = false;
  let currentRotation = 0;
  let history = [];
  let audioCtx = null;

  const FLIP_MS = 2000;

  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // short metallic tick — simulates the coin spinning through the air
  function playTick(ctx, time, freq, volume){
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(volume, time + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.085);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(time);
    osc.stop(time + 0.1);
  }

  // brighter double-ring "clink" for the landing moment
  function playLanding(ctx, time){
    [1600, 2350].forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time + i*0.02);
      gain.gain.setValueAtTime(0.0001, time + i*0.02);
      gain.gain.exponentialRampToValueAtTime(0.35, time + i*0.02 + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + i*0.02 + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time + i*0.02);
      osc.stop(time + i*0.02 + 0.55);
    });
    // soft low thud for weight
    const thud = ctx.createOscillator();
    const tg   = ctx.createGain();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(140, time);
    tg.gain.setValueAtTime(0.0001, time);
    tg.gain.exponentialRampToValueAtTime(0.28, time + 0.01);
    tg.gain.exponentialRampToValueAtTime(0.0001, time + 0.22);
    thud.connect(tg);
    tg.connect(ctx.destination);
    thud.start(time);
    thud.stop(time + 0.25);
  }

  function playFlipSound(){
    const ctx = getAudioCtx();
    const now = ctx.currentTime + 0.02;
    const totalDur = FLIP_MS / 1000;
    const freqs = [820, 1040, 960, 1180];
    let t = now;
    let interval = 0.055;
    let i = 0;
    // ticks start fast (spinning) and slow down as the coin nears the top of its arc, then speed up again as it falls
    while (t < now + totalDur - 0.12) {
      const progress = (t - now) / totalDur; // 0..1
      const wobble = Math.sin(progress * Math.PI); // slow near the middle (peak of toss)
      playTick(ctx, t, freqs[i % freqs.length], 0.16 - wobble * 0.06);
      i++;
      t += interval * (1 + wobble * 1.6);
    }
    playLanding(ctx, now + totalDur - 0.06);
  }

  function updateLedger(){
    marksEl.innerHTML = history.slice(-40).map(r =>
      r === 'heads'
        ? '<span class="mark-h">H</span>'
        : '<span class="mark-t">T</span>'
    ).join(' ') || '—';
  }

  function flip(){
    if (flipping) return;
    flipping = true;

    // unlock / start audio on the same user gesture
    playFlipSound();

    prompt.textContent = 'Flipping…';
    result.classList.remove('show');
    coin.classList.remove('landed');
    shadow.classList.add('tossing');

    const outcome = Math.random() < 0.5 ? 'heads' : 'tails';
    const spins = 5; // full rotations while airborne

    // The coin always rests at a rotation that is a multiple of 360 (heads)
    // or 360 + 180 (tails). To land on the correct face we have to add
    // exactly enough rotation to reach the desired residual (0 or 180),
    // not just a flat +180 — otherwise two "tails" in a row can cancel
    // out and visually land on heads while the text still says tails.
    const currentResidual = ((currentRotation % 360) + 360) % 360; // 0 or 180
    const desiredResidual = outcome === 'tails' ? 180 : 0;
    const extraToAlign = ((desiredResidual - currentResidual) + 360) % 360;
    const targetRotation = currentRotation + spins * 360 + extraToAlign;

    const anim = coin.animate([
      { transform: `translateY(0px) scale(1) rotateY(${currentRotation}deg) rotateX(0deg)`, offset: 0 },
      { transform: `translateY(-70px) scale(1.06) rotateY(${currentRotation + spins*90}deg) rotateX(10deg)`, offset: 0.28 },
      { transform: `translateY(-100px) scale(1.1) rotateY(${currentRotation + spins*200}deg) rotateX(0deg)`, offset: 0.5 },
      { transform: `translateY(-46px) scale(1.05) rotateY(${currentRotation + spins*320}deg) rotateX(-6deg)`, offset: 0.75 },
      { transform: `translateY(6px) scale(0.97) rotateY(${targetRotation - 6}deg) rotateX(0deg)`, offset: 0.93 },
      { transform: `translateY(0px) scale(1) rotateY(${targetRotation}deg) rotateX(0deg)`, offset: 1 }
    ], {
      duration: FLIP_MS,
      easing: 'cubic-bezier(.33,.0,.2,1)',
      fill: 'forwards'
    });

    anim.onfinish = () => {
      currentRotation = targetRotation;
      shadow.classList.remove('tossing');
      coin.classList.add('landed');

      result.textContent = outcome === 'heads' ? 'Heads' : 'Tails';
      result.classList.add('show');
      prompt.textContent = 'Tap the coin to flip again';
      announcer.textContent = `Result: ${outcome === 'heads' ? 'Heads' : 'Tails'}`;

      history.push(outcome);
      updateLedger();

      flipping = false;
    };
  }

  coin.addEventListener('click', flip);
  coin.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      flip();
    }
  });

  updateLedger();
})();
</script>

</body>
</html>
